[package]
name = "rustdl"
version = "0.1.1"
edition = "2021"
rust-version = "1.76"
description = "Desktop GUI for yt-dlp (egui)"
license = "MIT"
readme = "README.md"
# Crate metadata; in-app update check reads this URL when present.
repository = "https://github.com/Darknetzz/code"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["now"] }
winres = "0.1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = "3"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.29", default-features = true }
egui_extras = { version = "0.29", features = ["image"] }
egui_material_icons = "0.1.0"
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "webp"] }
once_cell = "1"
opener = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util", "macros"] }
url = "2"
which = "8"
notify-rust = "4"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
parking_lot = "0.12"
rust-embed = "8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
