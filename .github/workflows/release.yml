name: release

on:
  push:
    tags:
      - "rustdl-v*"
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustdl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustdl.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rustdl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rustdl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdl-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          chmod +x scripts/extract_release_notes.sh
          ./scripts/extract_release_notes.sh CHANGELOG.md "$tag" > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#rustdl-v}"
          ver="${ver#v}"
          repo="${{ github.repository }}"
          notes_file="${{ steps.notes.outputs.path }}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$repo" \
              --title "rustdl ${ver}" \
              --notes-file "$notes_file"
            gh release upload "$tag" artifacts/**/* --repo "$repo" --clobber
          else
            gh release create "$tag" \
              --repo "$repo" \
              --title "rustdl ${ver}" \
              --notes-file "$notes_file" \
              artifacts/**/*
          fi
