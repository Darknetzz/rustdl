# Disabled for automatic runs — build with scripts/build_binary.ps1|.sh and publish with gh locally.
# Manual dispatch only — does not run on tag push.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          GitHub release tag (e.g. rustdl-v0.11.0).
          Leave empty to use rustdl-v + version from Cargo.toml on the checked-out ref.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustdl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustdl.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rustdl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rustdl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets --all-features

      - name: cargo build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdl-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          input_tag='${{ inputs.tag }}'
          if [[ -n "$input_tag" ]]; then
            tag="$input_tag"
          else
            ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            if [[ -z "$ver" ]]; then
              echo "Could not read version from Cargo.toml" >&2
              exit 1
            fi
            tag="rustdl-v${ver}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Build release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          notes_file="release-notes.md"
          if ! bash scripts/extract_release_notes.sh CHANGELOG.md "$tag" >"$notes_file"; then
            echo "extract_release_notes.sh failed for tag $tag" >&2
            exit 1
          fi
          if [[ ! -s "$notes_file" ]]; then
            echo "Release notes file is empty: $notes_file" >&2
            exit 1
          fi
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          ver="${tag#rustdl-v}"
          ver="${ver#v}"
          repo="${GITHUB_REPOSITORY}"
          notes_file="${RELEASE_NOTES_FILE}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$repo" \
              --title "rustdl ${ver}" \
              --notes-file "$notes_file"
            gh release upload "$tag" artifacts/**/* --repo "$repo" --clobber
          else
            gh release create "$tag" \
              --repo "$repo" \
              --title "rustdl ${ver}" \
              --notes-file "$notes_file" \
              artifacts/**/*
          fi
