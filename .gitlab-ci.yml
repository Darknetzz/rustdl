# GitLab CI is the automatic build/publish path. GitHub Actions stay manual-only
# (workflow_dispatch) and are not used here.
#
# Runner: gitlab.roste.org currently has a Linux shared runner only. Windows
# rustdl.exe is built when WINDOWS_RUNNER_AVAILABLE=true and a runner with tag
# `windows` is registered.
#
# Project CI/CD variables (Settings → CI/CD → Variables):
#   GH_TOKEN  GitHub PAT with `repo` scope (masked; unprotect if `dev` is unprotected)
#   WINDOWS_RUNNER_AVAILABLE  "true" to enable the Windows job

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^rustdl-v/
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  FF_USE_FASTZIP: "true"

default:
  image: rust:1-bookworm
  interruptible: true

stages:
  - verify
  - publish

.linux_deps: &linux_deps
  - apt-get update
  - |
    apt-get install -y --no-install-recommends \
      build-essential pkg-config cmake clang libclang-dev \
      libgtk-3-dev libglib2.0-dev libxkbcommon-dev \
      libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
      libwayland-dev libasound2-dev python3 curl ca-certificates

.cargo_cache: &cargo_cache
  key:
    files:
      - Cargo.lock
    prefix: cargo-linux
  paths:
    - .cargo/
    - target/
  policy: pull-push

linux:
  stage: verify
  cache:
    <<: *cargo_cache
  before_script:
    - *linux_deps
    - rustc -vV
    - cargo --version
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all-targets --all-features
    - cargo build --release
    - mkdir -p dist
    - cp target/release/rustdl dist/rustdl-x86_64-unknown-linux-gnu
    - chmod +x dist/rustdl-x86_64-unknown-linux-gnu
  artifacts:
    name: rustdl-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/rustdl-x86_64-unknown-linux-gnu
    expire_in: 14 days

windows:
  stage: verify
  tags:
    - windows
  rules:
    - if: $WINDOWS_RUNNER_AVAILABLE == "true"
  cache:
    key:
      files:
        - Cargo.lock
      prefix: cargo-windows
    paths:
      - .cargo/
      - target/
    policy: pull-push
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - rustc -vV
    - cargo --version
  script:
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all-targets --all-features
    - cargo build --release
    - mkdir dist
    - copy target\release\rustdl.exe dist\rustdl.exe
  artifacts:
    name: rustdl-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/rustdl.exe
    expire_in: 14 days

publish:
  stage: publish
  interruptible: false
  needs:
    - job: linux
      artifacts: true
    - job: windows
      optional: true
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^rustdl-v/
  cache: []
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates python3 tar gzip
    - |
      curl -fsSL "https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz" \
        | tar -xz -C /tmp
      mv /tmp/gh_2.102.0_linux_amd64/bin/gh /usr/local/bin/gh
      gh --version
  script:
    - chmod +x scripts/ci_publish_releases.sh scripts/extract_release_notes.sh
    - ./scripts/ci_publish_releases.sh
  artifacts:
    name: rustdl-release-notes-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/
      - ci-release-notes.md
    expire_in: 30 days
    when: always
