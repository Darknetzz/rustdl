[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydl"
version = "0.1.0"
description = "Desktop GUI for yt-dlp with thumbnail preview"
readme = "README.md"
requires-python = ">3.11,<4"
dependencies = [
    "flet>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
pydl = "pydl.main:run_app"

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
